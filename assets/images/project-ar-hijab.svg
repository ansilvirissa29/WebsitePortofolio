<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glow-ar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3555c8" />
      <stop offset="100%" stop-color="#ff3131" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg-ar)"/>
  
  <!-- AR Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>

  <!-- Phone Mockup Frame -->
  <rect x="210" y="30" width="180" height="300" rx="28" fill="#0f172a" stroke="#3555c8" stroke-width="4"/>
  <rect x="220" y="45" width="160" height="270" rx="20" fill="#1e293b"/>
  
  <!-- AR Face Tracking Mesh -->
  <circle cx="300" cy="140" r="55" fill="none" stroke="#ff3131" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="300" cy="140" r="40" fill="#3555c8" fill-opacity="0.2"/>
  
  <!-- Face points -->
  <circle cx="285" cy="130" r="3" fill="#ff3131"/>
  <circle cx="315" cy="130" r="3" fill="#ff3131"/>
  <circle cx="300" cy="145" r="3" fill="#ff3131"/>
  <circle cx="300" cy="160" r="3" fill="#3555c8"/>

  <!-- Hijab AR Mesh Simulation -->
  <path d="M 260 110 Q 300 80 340 110 Q 355 160 345 200 Q 300 220 255 200 Q 245 160 260 110 Z" fill="none" stroke="url(#glow-ar)" stroke-width="3"/>

  <!-- UI Scanner Overlays -->
  <rect x="235" y="240" width="130" height="35" rx="8" fill="#3555c8" fill-opacity="0.85"/>
  <text x="300" y="262" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AR FACE MATCH: 98%</text>

  <!-- Floating AR Badges -->
  <g transform="translate(60, 100)">
    <rect width="120" height="42" rx="10" fill="#0f172a" stroke="#3555c8" stroke-width="1.5"/>
    <text x="60" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Augmented Reality</text>
  </g>

  <g transform="translate(420, 190)">
    <rect width="130" height="42" rx="10" fill="#0f172a" stroke="#ff3131" stroke-width="1.5"/>
    <text x="65" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#ff3131" text-anchor="middle">Virtual Try-On</text>
  </g>
</svg>
