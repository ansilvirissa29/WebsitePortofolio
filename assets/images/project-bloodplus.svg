<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-blood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg-blood)"/>

  <!-- Hospital Dashboard Mockup Window -->
  <rect x="70" y="45" width="460" height="270" rx="16" fill="#1e293b" stroke="#ff3131" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Window Header -->
  <rect x="70" y="45" width="460" height="42" rx="16" fill="#0f172a"/>
  <circle cx="95" cy="66" r="6" fill="#ef4444"/>
  <circle cx="112" cy="66" r="6" fill="#eab308"/>
  <circle cx="129" cy="66" r="6" fill="#22c55e"/>
  <text x="300" y="70" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">BloodPlus Real-Time Hospital Stock Dashboard</text>

  <!-- Blood Drop Graphic Central -->
  <g transform="translate(100, 115)">
    <circle cx="50" cy="50" r="42" fill="#3555c8" fill-opacity="0.2"/>
    <!-- Blood Drop Icon -->
    <path d="M 50 15 C 50 15, 20 55, 20 72 C 20 88, 33 100, 50 100 C 67 100, 80 88, 80 72 C 80 55, 50 15, 50 15 Z" fill="url(#drop-grad)"/>
    <text x="50" y="77" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">A+</text>
  </g>

  <!-- Stock Status Cards -->
  <g transform="translate(230, 110)">
    <rect width="270" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">RSU Zainoel Abidin (Main Center)</text>
    <text x="18" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#22c55e">● 142 Kantong Siap Distribusi</text>
  </g>

  <g transform="translate(230, 175)">
    <rect width="270" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">RS Meuraxa (Emergency Unit)</text>
    <text x="18" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#eab308">● 28 Kantong (Perlu Suplai B+)</text>
  </g>

  <g transform="translate(230, 240)">
    <rect width="270" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Palang Merah Indonesia (PMI Unit)</text>
    <text x="18" y="42" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#3555c8">● Terhubung Integrasi API 24/7</text>
  </g>
</svg>
